name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-to-audiobook-*
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          fail_on_unmatched_files: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
            script: package:linux
            artifact_pattern: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - target: win
            os: windows-latest
            script: package:win
            artifact_pattern: |
              release/*.exe
              release/*.appx
              release/*.msi
          - target: mac
            os: macos-latest
            script: package:mac
            artifact_pattern: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install OS-specific system libraries
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ffmpeg libfuse2 libnss3 libnspr4 fontconfig dbus-x11 libasound2

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress

      - name: Set up static ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Bundle ffmpeg
        shell: bash
        run: |
          # Ensure ffmpeg resource directory exists so electron-builder extraResources succeeds
          mkdir -p ffmpeg/bin
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          for t in ffplay ffmpeg ffprobe; do
            cp "$(which $t)" "ffmpeg/bin/$t$ext"
          done

      # Set up Python virtual environment named audiobook_env matching package.json scripts
      - name: Set up audiobook_env virtual environment (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python -m venv audiobook_env
          source audiobook_env/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
          python -m pip install pyinstaller
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Set up audiobook_env virtual environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv audiobook_env
          .\audiobook_env\Scripts\Activate.ps1
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install pyinstaller
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m spacy download en_core_web_sm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Install Node dependencies
      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      # Build PyInstaller executable and package Electron application
      - name: Build & Package App
        run: |
          npm run ${{ matrix.script }}

      # Upload artifacts to GitHub Actions run artifacts
      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-audiobook-${{ matrix.target }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error
