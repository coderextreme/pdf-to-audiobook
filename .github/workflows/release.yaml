name: Release

# Uses NO third-party actions (the repo only allows actions owned by coderextreme).
# Everything is done with git, gh, node, npm and python that ship on the runners.
#
# Flow (tag push, or manual run started from a tag):
#   create-release -> creates a DRAFT release
#   build (x6)     -> each platform builds on its OWN runner and uploads its
#                     installers to that draft:
#                       linux       -> ubuntu-24.04     (CPU torch, default names)
#                       win         -> windows-latest   (CPU torch, default names)
#                       mac         -> macos-latest     (default torch, uses Metal)
#                       linux-cuda  -> ubuntu-24.04     (NVIDIA CUDA torch, "-cuda" names)
#                       win-cuda    -> windows-latest   (NVIDIA CUDA torch, "-cuda" names)
#                       linux-rocm  -> ubuntu-24.04     (AMD ROCm torch, "-rocm" names)
#   publish        -> only if every build succeeded, un-drafts the release
#
# Manual run from a branch: the builds run as a smoke test; nothing is
# released and nothing is uploaded.
#
# ROCm is Linux-only: PyTorch does not publish ROCm wheels for Windows or macOS.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release (leave it as a draft, do not publish)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Create (or reuse) a draft release for the tag
  # ---------------------------------------------------------------------------
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create draft release if it does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  # ---------------------------------------------------------------------------
  # 2. Build each platform and upload installers to the draft release
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    # create-release is skipped on branch runs; that is fine. A failure is not.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    # Each matrix entry runs on its own OS (see matrix.os below).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Fields:
        #   gpu         none | cuda | rocm. Anything but "none" gets that word
        #               added to the installer file names (App-1.0.0-cuda.exe)
        #               so variants never overwrite each other on the release.
        #   torch_index pip index to install torch from ("" = default PyPI).
        #   torch_pkgs  torch packages to install from that index.
        #
        # Check the index tags against https://pytorch.org/get-started/locally/
        # now and then: CUDA tags are cu126 / cu128 / cu130, ROCm tags are
        # rocm7.1 / rocm7.2. A newer torch can need a newer tag.
        include:
          - target: linux
            os: ubuntu-24.04
            script: package:linux
            assets: release/*.AppImage release/*.deb release/*.rpm
            gpu: none
            torch_index: https://download.pytorch.org/whl/cpu
            torch_pkgs: "torch torchaudio"
          - target: win
            os: windows-latest
            script: package:win
            # The upload step fails if a pattern matches nothing, so remove
            # release/*.appx if your Windows build does not produce one.
            assets: release/*.exe release/*.appx
            gpu: none
            torch_index: https://download.pytorch.org/whl/cpu
            torch_pkgs: "torch torchaudio"
          - target: mac
            os: macos-latest
            script: package:mac
            assets: release/*.dmg release/*.zip
            gpu: none
            # macOS wheels come from the default PyPI index (Metal/MPS, no CUDA).
            torch_index: ""
            torch_pkgs: "torch torchaudio"

          # ---- NVIDIA CUDA (Linux + Windows) ----
          - target: linux-cuda
            os: ubuntu-24.04
            script: package:linux
            assets: release/*.AppImage release/*.deb release/*.rpm
            gpu: cuda
            torch_index: https://download.pytorch.org/whl/cu128
            torch_pkgs: "torch torchaudio"
          - target: win-cuda
            os: windows-latest
            script: package:win
            assets: release/*.exe release/*.appx
            gpu: cuda
            torch_index: https://download.pytorch.org/whl/cu128
            torch_pkgs: "torch torchaudio"

          # ---- AMD ROCm (Linux only) ----
          # torch is capped below 2.11 because the rocm7.1 index does not carry
          # newer builds. Move to rocm7.2 and drop the cap to use torch 2.11+.
          - target: linux-rocm
            os: ubuntu-24.04
            script: package:linux
            assets: release/*.AppImage release/*.deb release/*.rpm
            gpu: rocm
            torch_index: https://download.pytorch.org/whl/rocm7.1
            torch_pkgs: "torch<2.11 torchaudio<2.11"

    steps:
      # GPU torch wheels are several GB and PyInstaller/electron-builder copy
      # them again, so free space on the Linux runner before doing anything.
      - name: Free disk space (Linux GPU variants)
        if: runner.os == 'Linux' && matrix.gpu != 'none'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      # Replaces actions/checkout. The token is only used for the fetch and is
      # removed from the remote URL afterwards so build scripts never see it.
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      # Replaces setup-node / setup-python: we use what the runner image ships.
      # Check these lines in the log against what your project expects.
      - name: Show toolchain versions
        shell: bash
        run: |
          node --version
          npm --version
          (python3 --version 2>/dev/null || python --version)
          git --version
          gh --version | sed -n 1p

      # Linux only: libraries for electron-builder (AppImage, rpm) and Electron.
      # Names are the Ubuntu 24.04 ones (t64 suffix on libasound2 / libfuse2).
      # The GPU variants need nothing extra here: the CUDA and ROCm torch
      # wheels bundle their own runtime libraries.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libfuse2t64 libnss3 libnspr4 fontconfig dbus-x11 libasound2t64
          sudo apt install -y xkb-data fontconfig dbus-x11
          sudo apt install -y python3.12 python3.12-venv npm libnss3-tools libsmbclient0 ffmpeg fuse3 libfuse2

      # Replaces setup-ffmpeg and the system ffmpeg installs. The npm packages
      # carry statically linked binaries for the runner's own OS/arch. They are
      # installed in a temp dir WITHOUT --ignore-scripts because ffmpeg-static
      # downloads its binary in a postinstall script.
      - name: Fetch static ffmpeg, ffprobe and ffplay
        shell: bash
        run: |
          FETCH_DIR="$RUNNER_TEMP/ffmpeg-fetch"
          mkdir -p "$FETCH_DIR"
          cd "$FETCH_DIR"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ffmpeg-static@5 ffprobe-static@3 ffplay-static@3
          node -e "
            const fs = require('fs');
            const path = require('path');
            const ext = process.platform === 'win32' ? '.exe' : '';
            const dest = path.join(process.env.GITHUB_WORKSPACE, 'ffmpeg', 'bin');
            fs.mkdirSync(dest, { recursive: true });
            const bins = {
              ffmpeg: require('ffmpeg-static'),
              ffprobe: require('ffprobe-static').path,
              ffplay: require('ffprobe-static'),
            };
            for (const [name, src] of Object.entries(bins)) {
              if (!src || !fs.existsSync(src)) {
                console.error('Missing binary for ' + name + ': ' + src);
                process.exit(1);
              }
              const target = path.join(dest, name + ext);
              fs.copyFileSync(src, target);
              fs.chmodSync(target, 0o755);
              console.log('Bundled ' + name + ' -> ' + target);
            }
          "
          cd "$GITHUB_WORKSPACE"
          ls -l ffmpeg/bin
          ./ffmpeg/bin/ffmpeg -version | sed -n 1p
          ./ffmpeg/bin/ffprobe -version | sed -n 1p
          ./ffmpeg/bin/ffplay -version | sed -n 1p
          file ffmpeg/bin/ffmpeg || true
          file ffmpeg/bin/ffplay || true

      # One bash script for all three OSes. GitHub's bash runs with -e -o
      # pipefail, so any failing command fails the step.
      # Inside the venv we call `python` (a venv on Windows has no python3.exe).
      # Which torch build gets installed is decided by the matrix (cpu / cuda /
      # rocm); the last lines fail the job if the wrong build ended up in the venv.
      - name: Set up audiobook_env virtual environment
        shell: bash
        env:
          GPU: ${{ matrix.gpu }}
          TORCH_INDEX: ${{ matrix.torch_index }}
          TORCH_PKGS: ${{ matrix.torch_pkgs }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            py -3.12 -m venv audiobook_env
            source audiobook_env/Scripts/activate
          else
            # macOS runners do not guarantee python3.12 on PATH
            if ! command -v python3.12 >/dev/null 2>&1; then
              brew install python@3.12
            fi
            python3.12 -m venv audiobook_env
            source audiobook_env/bin/activate
          fi
          python -m pip install --upgrade pip setuptools wheel
          read -ra torch_pkgs <<< "$TORCH_PKGS"
          if [ -n "$TORCH_INDEX" ]; then
            python -m pip install "${torch_pkgs[@]}" --index-url "$TORCH_INDEX"
          else
            python -m pip install "${torch_pkgs[@]}"
          fi
          python -m pip install .
          python -m pip install pyinstaller
          python -m spacy download en_core_web_sm
          # nltk.download() returns False instead of raising on failure
          python -c "import nltk; assert nltk.download('punkt') and nltk.download('punkt_tab')"
          # Make sure `pip install .` did not swap in a different torch build.
          python - <<'PY'
          import os, torch
          gpu = os.environ["GPU"]
          hip = getattr(torch.version, "hip", None)
          print("torch", torch.__version__, "| cuda:", torch.version.cuda, "| hip:", hip)
          if gpu == "cuda":
              assert torch.version.cuda, "expected a CUDA build of torch"
          elif gpu == "rocm":
              assert hip, "expected a ROCm build of torch"
          PY
          pyinstaller --log-level WARN --collect-all spacy --collect-all en_core_web_sm --copy-metadata en_core_web_sm --copy-metadata spacy --collect-all thinc --collect-all srsly --collect-all spacy_legacy --collect-all spacy_loggers --collect-all cymem --collect-all preshed --collect-all murmurhash --collect-all blis --collect-all catalogue --collect-all wasabi --collect-all weasel --collect-all confection --collect-all espeakng_loader --collect-all kokoro --collect-all misaki --collect-all transformers --collect-all language_tags --collect-data espeakng_loader --copy-metadata torch --copy-metadata tqdm --copy-metadata regex --copy-metadata requests --copy-metadata packaging --copy-metadata filelock --copy-metadata numpy --copy-metadata tokenizers --onedir PDF_to_Audiobook.py

      - name: Install Node dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      # No GH_TOKEN here on purpose: electron-builder auto-publishes when it
      # sees one, and build scripts should not hold a write token.
      - name: Build & Package App
        shell: bash
        env:
          SCRIPT: ${{ matrix.script }}
          # Code signing (electron-builder reads these). Add the secrets, then
          # uncomment what you need.
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run "$SCRIPT"

      # CUDA / ROCm builds produce installers with the same names as the
      # default build, so add the variant before upload:
      #   App_Setup_1.0.0.exe -> App_Setup_1.0.0-cuda.exe
      # The default (gpu: none) builds keep their original names.
      - name: Add GPU variant to installer file names
        if: matrix.gpu != 'none'
        shell: bash
        env:
          GPU: ${{ matrix.gpu }}
          ASSETS: ${{ matrix.assets }}
        run: |
          shopt -s nullglob
          read -ra patterns <<< "$ASSETS"
          for p in "${patterns[@]}"; do
            for f in $p; do
              new="${f%.*}-${GPU}.${f##*.}"
              echo "Renaming $f -> $new"
              mv -- "$f" "$new"
            done
          done

      - name: List build output
        shell: bash
        run: ls -lh release/

      # Replaces upload-artifact / download-artifact / action-gh-release.
      # Fails if any pattern matches nothing. Skipped on branch runs.
      # GitHub rejects release assets larger than 2 GiB; a failure here on a
      # GPU variant usually means the installer got too big (see the log above).
      - name: Upload installers to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSETS: ${{ matrix.assets }}
        run: |
          shopt -s nullglob
          read -ra patterns <<< "$ASSETS"
          files=()
          for p in "${patterns[@]}"; do
            matches=( $p )
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::No files match $p"
              exit 1
            fi
            files+=( "${matches[@]}" )
          done
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # 3. Publish the release, only if every platform uploaded successfully
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && inputs.draft != true
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "Assets on release $TAG:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
