appId: com.innerninja.pdf-to-audiobook
productName: PDFToAudiobook
directories:
  output: release
asar: true
files:
  - out/**/*
  - PDF_to_Audiobook.py
  - pyproject.toml
asarUnpack:
  - ffmpeg/**/*
win:
  target: [nsis-web, appx]
  icon: frm_Main/favicon.ico
appx:
  identityName: JohnCarlson.PDFToAudiobook
  publisher: CN=8A2CB2FC-2019-41E3-B5EB-6DDF69819614
  publisherDisplayName: John Carlson
  applicationId: PDFToAudiobook
  displayName: PDFToAudiobook
  backgroundColor: "#1a1a1a"
  languages: [en-US]
  showNameOnTiles: false
nsis:
  oneClick: false
  createDesktopShortcut: true
  include: frm_Main/installer.nsh
  allowToChangeInstallationDirectory: true
  shortcutName: PDF to AudioBook
  differentialPackage: false
publish:
  provider: generic
  url: https://coderextreme.net/pdf-to-audiobook-cuda/
extraResources:
  - from: PDF_to_Audiobook.py
    to: PDF_to_Audiobook.py
  - from: dist/PDF_to_Audiobook
    to: PDF_to_Audiobook
  - from: pyproject.toml
    to: pyproject.toml
  - from: ffmpeg
    to: ffmpeg
    filter: ["**/*"]
